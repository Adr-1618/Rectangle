name: SnapGrid Build

on: [push, pull_request, workflow_dispatch]

permissions: read-all

env:
  XCODE_PROJECT: "Rectangle.xcodeproj"
  XCODE_SCHEME: "Rectangle"
  CODE_SIGN_IDENTITY: "-"
  BUILD_DIR: "build"
  XCODE_ARCHIVE: "SnapGrid.xcarchive"
  APP_NAME: "SnapGrid.app"
  EXPORT_OPTIONS_PLIST: "exportOptions.plist"
  DMG_NAME: "SnapGrid"
  DMG_FILE_NAME: "SnapGrid.dmg"

jobs:
  build:
    runs-on: xcode-27
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Generate app icon sizes
      run: |
        source="Rectangle/Branding/SnapGrid-App-Icon.png"
        target="Rectangle/Assets.xcassets/AppIcon.appiconset"
        sips -z 16 16 "$source" --out "$target/mac016pts1x.png" >/dev/null
        sips -z 32 32 "$source" --out "$target/mac016pts2x.png" >/dev/null
        cp "$target/mac016pts2x.png" "$target/mac032pts1x.png"
        sips -z 64 64 "$source" --out "$target/mac032pts2x.png" >/dev/null
        sips -z 128 128 "$source" --out "$target/mac128pts1x.png" >/dev/null
        sips -z 256 256 "$source" --out "$target/mac128pts2x.png" >/dev/null
        cp "$target/mac128pts2x.png" "$target/mac256pts1x.png"
        sips -z 512 512 "$source" --out "$target/mac256pts2x.png" >/dev/null
        cp "$target/mac256pts2x.png" "$target/mac512pts1x.png"
        sips -z 1024 1024 "$source" --out "$target/mac512pts2x.png" >/dev/null
    - name: Build
      run: xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" archive CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" -archivePath "$BUILD_DIR/$XCODE_ARCHIVE"
    - name: Test
      run: xcodebuild test -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -destination 'platform=macOS' CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" CODE_SIGNING_ALLOWED=NO
    - name: Export
      run: |
        plutil -convert xml1 - -o "$EXPORT_OPTIONS_PLIST" << EOF
          {
            "destination": "export",
            "method": "mac-application"
          }
        EOF

        xcodebuild -exportArchive -archivePath "$BUILD_DIR/$XCODE_ARCHIVE" -exportPath "$BUILD_DIR" -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"
    - name: Resign App
      run: codesign --force --deep -s "$CODE_SIGN_IDENTITY" "$BUILD_DIR/$APP_NAME"
    - name: Make DMG
      run: hdiutil create -srcdir "$BUILD_DIR" -volname "$DMG_NAME" "$DMG_FILE_NAME"
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: SnapGrid
        path: ${{ env.DMG_FILE_NAME }}
